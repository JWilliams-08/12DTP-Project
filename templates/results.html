<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find A Fill In</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header></header>
    <h1>Avaliable Fill-Ins</h1>
    <div class="results">
        {% if valid_players %}
            <ul>
                {% for player in valid_players %}
                    <li>{{ player.player_name }} - {{ player.team_name }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No available fill-ins found for this request.</p>
        {% endif %}

        <a href="/"><button>Submit another request</button></a>
    </body>
</html>
